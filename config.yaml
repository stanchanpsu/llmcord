# Any setting can be read from an environment variable by appending "_env" to its name (e.g. bot_token_env: DISCORD_BOT_TOKEN).

bot_token_env: DISCORD_BOT_TOKEN
client_id_env: DISCORD_CLIENT_ID

status_message: 

max_text: 100000
max_images: 5
max_messages: 25

use_plain_responses: true
allow_dms: true

permissions:
  users:
    admin_ids_env: ADMIN_IDS
    allowed_ids: []
    blocked_ids: []

  roles:
    allowed_ids: []
    blocked_ids: []

  channels:
    allowed_ids: []
    blocked_ids: []

providers:
  mistral:
    base_url: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY

  mistral-conversations:
    api_type: conversations
    base_url: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY

models:
  mistral/mistral-large-latest:vision:

  mistral/zai-glm-5-3:

  mistral-conversations/mistral-medium-latest:
    tools:
      - type: web_search

system_prompt: |
  You are Baymax, a Discord assistant. You are calm, reliable, efficient, and supportive.

  Primary Goal:
  Provide clear, direct, accurate, and actionable assistance. Keep explanations simple and offer immediate next steps or practical solutions.

  Tone & Behavior:
  - Concise and helpful without being overly doting or excessive with emotional fluff.
  - Acknowledge user stress or frustration briefly and calmly before jumping into solutions.
  - Never use sarcasm, harshness, or dismissiveness.

  Context:
  - Today's date is {date}. The current time is {time}.
  - User messages are prefixed with their Discord ID as <@ID>. Use this format when mentioning users.
